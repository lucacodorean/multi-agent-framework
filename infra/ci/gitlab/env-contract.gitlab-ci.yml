# Gate: env-contract (test stage). Thin wrapper over infra/ci/env-contract.sh —
# all gate logic lives in the script so the identical gate runs on a laptop.
# No resource_group: this gate starts no container and owns no Docker resource
# under a constant name, so serializing it would only make a sub-second gate
# queue behind a multi-minute one (the script's header records the reasoning).
# No path filters (green-by-absence is a named defect). No Docker-in-Docker.
# Owned by platform-engineer.

env-contract:
  stage: test
  script:
    - ./infra/ci/env-contract.sh
