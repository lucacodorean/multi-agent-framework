# Reference stub of the target .ddev/config.yaml this template's bootstrap produces.
# NOT used directly — infra/ddev/bootstrap.sh generates the real .ddev/config.yaml
# via `ddev config`. Kept here so the intended topology is reviewable in one place
# and so hand-tuning after bootstrap has a documented baseline.

name: oir-flow

# One of: laravel | symfony | php | generic (Go, Python, …). The platform context is
# Laravel (docs/architecture.md § System).
type: laravel

# PHP stacks typically: public. Non-PHP/generic stacks: "." plus a
# web_extra_daemons entry to run the app process, e.g.:
#   web_extra_daemons:
#     - name: app
#       command: "go run ./cmd/api"     # or: uvicorn app:app --port 8080 ...
#       directory: /var/www/html
docroot: public

# Template baseline — fixed regardless of stack (docs/topology/local.md § Services):
database:
  type: postgres
  version: "16"

# Node.js lives in the web container ONLY to run Spectral (contract linting) — the
# host never needs it. Pinned so every machine lints identically. Even generic (Go /
# Python) projects keep this; it costs nothing and keeps `ddev contract-lint` working.
nodejs_version: "22"

# Mail. DDEV runs Mailpit inside the web container with no configuration from us, and
# config/mail.php carries the same values as defaults. Only the sender identity needs injecting
# here: dotenv never overwrites a value already in .env, but it also never overwrites a real
# container variable, so web_environment wins. Set by bootstrap.sh via --web-environment-add.
web_environment:
  - MAIL_FROM_ADDRESS=no-reply@oir-flow.ddev.site
  # Added only when engine/ exists — see bootstrap.sh:
  - ENGINE_URL=http://engine:8000
  - ENGINE_KEY=dev-only-insecure-engine-key
  # Merged from infra/ddev/config.locale.yaml (not this file) so `ddev config` cannot drop them.
  - APP_LOCALE=ro
  - APP_FALLBACK_LOCALE=en
  - APP_FAKER_LOCALE=en_US

# Redis is provided by the official add-on (installed by bootstrap.sh):
#   ddev add-on get ddev/ddev-redis
# The contract-lint command is installed as .ddev/commands/web/contract-lint
# (source: infra/ddev/commands/web/contract-lint) → `ddev contract-lint`.

# Remote-development VM (user decision 2026-07-28): bind host ports on every interface,
# not just 127.0.0.1, so the project is reachable from outside the VM. Set by
# bootstrap.sh via --bind-all-interfaces. NOTE: this covers the PROJECT's ports only —
# the shared router (80/443) needs the host-global companion setting, which lives in
# ~/.ddev/global_config.yaml and cannot be expressed here:
#   ddev config global --router-bind-all-interfaces=true
bind_all_interfaces: true

# Stable host publish of Postgres so external clients (GUI, another host) can
# reach it without reading a dynamic DDEV port. Combined with bind_all_interfaces
# this is 0.0.0.0:5432 → db:5432. Set by bootstrap.sh via --host-db-port=5432.
# Do not run oir-flow-preview on the same host without moving DB_HOST_PORT.
host_db_port: "5432"

# PHP version is pinned explicitly by bootstrap.sh (--php-version=8.5): the topology is
# PHP 8.5 (docs/topology/local.md § Services) while DDEV's own default is 8.4, so it must
# never be left implicit.
php_version: "8.5"
webserver_type: nginx-fpm
