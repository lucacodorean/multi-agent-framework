# Platform-owned DDEV extra daemons — source of truth for .ddev/config.daemons.yaml, copied
# there verbatim by infra/ddev/bootstrap.sh. A separate config file because bootstrap
# regenerates config.yaml through `ddev config`, which has no flag for web_extra_daemons.
# The referenced script is not copied: the repository is bind-mounted at /var/www/html.

web_extra_daemons:
  # Supervised by DDEV for as long as the project is up. Queued work is a hard dependency of
  # the mailed setup link and the engine's queued-only `convertPdf`, and without a worker both
  # produce silence rather than an error; the script wraps `queue:listen`, not `queue:work`.
  - name: "queue-worker"
    command: "infra/ddev/daemons/queue-worker.sh"
    directory: /var/www/html
