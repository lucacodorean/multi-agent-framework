# Redis configuration for oir-flow — PLATFORM-OWNED, RUNTIME-AGNOSTIC.
#
# SOURCE OF TRUTH: infra/shared/redis/redis.conf — one file, owned by no runtime
# (docs/architecture.md § Runtimes). Its consumers, the generated local copy and the
# `#ddev-generated` marker prepended onto that copy: docs/topology/local.md § Generation.
# Edit here and re-run bootstrap; never hand-edit a copy, never fork it into a runtime
# directory.

maxmemory 2048mb

# Eviction: NONE — deliberate. The policy and its consequence, that every cache entry needs
# an explicit TTL: docs/architecture.md § Tenancy (Redis keyspaces). Under memory pressure
# the escape hatch is a second Redis for the cache, never a relaxed policy here:
# infra/README.md § Deployment constraints.
maxmemory-policy noeviction

# Persistence: add-on default (RDB snapshots — `save 3600 1 300 100 60 10000`, appendonly
# off). The snapshots only shorten a cold start; they are not a durability guarantee. To
# disable persistence entirely, uncomment:
#appendonly no
#save ""
