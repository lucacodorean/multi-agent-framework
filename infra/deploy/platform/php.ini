; Preview-platform PHP overrides (loaded after php.ini-production).
upload_max_filesize = 32M
post_max_size = 32M
memory_limit = 256M
max_execution_time = 120
expose_php = Off

; Baked image: timestamps cannot change without a rebuild.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
