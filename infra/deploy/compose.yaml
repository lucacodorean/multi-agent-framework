# Preview Compose contract — SOURCE OF TRUTH: this file.
# Project name is load-bearing: CI must never `up`/`down` `oir-flow-preview`.
# Build context for both images is the repository root and the paths below are relative to
# THIS file's directory, so invoke with `-f infra/deploy/compose.yaml` and never pass
# `--project-directory` at the repo root — that breaks `../..` and the Redis conf bind-mount.
#
# Local image names are explicit. web and queue MUST share `oir-flow-preview-web`:
# CI (`deploy-stack.sh`) builds `web` only, and `up --no-build` must start queue
# from that same tag. Without `image:`, Compose looks for `oir-flow-preview-queue`
# which is never built. `pull_policy: never` — these tags exist in no registry
# (same Hub-pull trap as infra/ddev/docker-compose.engine.yaml).
#
# Engine exposure (contract/engine.openapi.yaml servers — internal-only):
#   * no `ports:`            — publishing :8000 is a contract violation
#   * `expose: 8000` only    — intended path is http://engine:8000 from web/queue
# Isolation here is "not published". Network policy is a later deploy concern.
#
# Postgres is published: 0.0.0.0:${DB_HOST_PORT:-5432} → db:5432. Engine stays
# unpublished. Do not run this project and DDEV (host_db_port 5432) together
# without moving one of the host ports.
#
# Redis conf is the runtime-agnostic infra/shared/redis/redis.conf (noeviction),
# bind-mounted as ../shared/redis/redis.conf. It belongs to no runtime: do not
# copy/fork it into infra/deploy/, and never reach into infra/ddev/ for it.
#
# Web is HTTPS only: host 443 → container 8443, because non-root cannot bind :443 inside the
# container. Self-signed cert unless the operator bind-mounts fullchain.pem + privkey.pem at
# /var/lib/oir-flow/tls (or sets TLS_CERT / TLS_KEY).

name: oir-flow-preview

x-platform-build: &platform-build
    context: ../..
    dockerfile: infra/deploy/platform/Dockerfile

# Same local tag for web and queue. CI builds it once as service `web`.
x-platform-image: &platform-image oir-flow-preview-web

x-platform-environment: &platform-environment
    APP_NAME: ${APP_NAME}
    APP_ENV: ${APP_ENV}
    APP_KEY: ${APP_KEY:-}
    APP_DEBUG: ${APP_DEBUG}
    APP_URL: ${APP_URL}
    APP_LOCALE: ${APP_LOCALE:-ro}
    APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
    APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-en_US}
    DB_CONNECTION: ${DB_CONNECTION}
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    DB_DATABASE: ${DB_DATABASE}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD:-}
    REDIS_CLIENT: ${REDIS_CLIENT}
    REDIS_HOST: ${REDIS_HOST}
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    REDIS_PORT: ${REDIS_PORT}
    ENGINE_URL: ${ENGINE_URL}
    ENGINE_KEY: ${ENGINE_KEY:-}
    MAIL_MAILER: ${MAIL_MAILER}
    MAIL_SCHEME: ${MAIL_SCHEME}
    MAIL_HOST: ${MAIL_HOST}
    MAIL_PORT: ${MAIL_PORT}
    MAIL_USERNAME: ${MAIL_USERNAME}
    MAIL_PASSWORD: ${MAIL_PASSWORD}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    SESSION_DRIVER: ${SESSION_DRIVER}
    QUEUE_CONNECTION: ${QUEUE_CONNECTION}
    CACHE_STORE: ${CACHE_STORE}
    FILESYSTEM_DISK: ${FILESYSTEM_DISK}
    LOG_CHANNEL: ${LOG_CHANNEL}
    LOG_LEVEL: ${LOG_LEVEL}
    REDIS_QUEUE_RETRY_AFTER: ${REDIS_QUEUE_RETRY_AFTER}
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE}
    TLS_HOSTNAME: ${TLS_HOSTNAME:-localhost}
    STAGING_SEED_PASSWORD: ${STAGING_SEED_PASSWORD:-}
    LOGIN_THROTTLE_ENABLED: ${LOGIN_THROTTLE_ENABLED:-false}

services:
    web:
        image: *platform-image
        pull_policy: never
        build: *platform-build
        environment:
            <<: *platform-environment
        ports:
            - "0.0.0.0:443:8443"
        depends_on:
            - db
            - redis
            - engine
            - mailpit

    queue:
        image: *platform-image
        pull_policy: never
        build: *platform-build
        environment:
            <<: *platform-environment
        command: ["php", "artisan", "queue:work", "--tries=1", "--timeout=360"]
        depends_on:
            - db
            - redis
            - engine
            - mailpit

    db:
        image: postgres:16
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-}
        volumes:
            - db-data:/var/lib/postgresql/data
        # Published on every host interface for external clients. The app still
        # uses DB_HOST=db / DB_PORT=5432 on the compose network. Do not run DDEV
        # (host_db_port 5432) on the same host without changing DB_HOST_PORT.
        ports:
            - "0.0.0.0:${DB_HOST_PORT:-5432}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7.4.10-bookworm
        command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
        volumes:
            - ../shared/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
            - redis-data:/data
        expose:
            - "6379"
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    engine:
        image: oir-flow-preview-engine
        pull_policy: never
        build:
            context: ../..
            dockerfile: infra/deploy/engine/Dockerfile
        environment:
            # Empty default — NOT the DDEV `dev-only-insecure-engine-key`.
            # Unset/empty does not disable the check: guarded operations 503
            # (shared-secret-absent); GET /health is 200 / degraded.
            ENGINE_KEY: ${ENGINE_KEY:-}
            ENGINE_PDF_TIMEOUT: ${ENGINE_PDF_TIMEOUT:-120}
        expose:
            - "8000"
        healthcheck:
            test:
                - CMD
                - python
                - -c
                - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s

    mailpit:
        image: axllent/mailpit:v1.30.7
        ports:
            - "8025:8025"
        expose:
            - "1025"

volumes:
    db-data:
    redis-data:
